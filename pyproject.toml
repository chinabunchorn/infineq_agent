[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "infineq"
version = "0.1.0"
description = "Evidence-first LLM serving reliability copilot"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Nuttanan Apirakcheewan" }]
dependencies = [
  "azure-ai-projects>=2.4.0,<3",
  "azure-core>=1.41.0,<2",
  "azure-identity>=1.25.0,<2",
  "openai>=3.13.0,<4",
  "pydantic>=2.12.0,<3",
  "python-dotenv>=1.1.0,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.18.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infineq"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["infineq"]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["infineq"]
warn_unused_configs = true
